services:
  toxic-bet-fe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toxic-bet-fe
    restart: unless-stopped
    environment:
      PORT: 4000
      API_TARGET: https://api.toxicbet.com.br
      AUTH_TARGET: https://auth.toxicbet.com.br
    ports:
      - "4200:4000"
    networks:
      - shared-services

networks:
  shared-services:
    external: true
