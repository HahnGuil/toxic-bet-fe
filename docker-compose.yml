services:
  toxic-bet-fe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toxic-bet-fe
    restart: unless-stopped
    environment:
      PORT: 4000
      API_TARGET: ${API_TARGET:-http://toxic-bet-api:20000}
      AUTH_TARGET: ${AUTH_TARGET:-http://ms-auth-server:2300}
    ports:
      - "4200:4000"
    networks:
      - shared-services

networks:
  shared-services:
    external: true
    name: ${SHARED_SERVICES_NETWORK:-shared-services}
