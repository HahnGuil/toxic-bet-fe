apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxic-bet-fe
  namespace: toxicbet
  labels:
    app: toxic-bet-fe
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: toxic-bet-fe
  template:
    metadata:
      labels:
        app: toxic-bet-fe
    spec:
      containers:
        - name: toxic-bet-fe
          image: ghcr.io/hahnguil/toxic-bet-fe:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: toxic-bet-fe-config
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: toxic-bet-fe
  namespace: toxicbet
  labels:
    app: toxic-bet-fe
spec:
  type: LoadBalancer
  selector:
    app: toxic-bet-fe
  ports:
    - name: http
      port: 4200
      targetPort: http
