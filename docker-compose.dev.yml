services:
  toxic-bet-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_SCRIPT: build:dev
    container_name: toxic-bet-fe-dev
    restart: unless-stopped
    environment:
      PORT: 4000
      API_TARGET: http://toxic-bet-docker-api:20000
      AUTH_TARGET: http://ms-auth-server:2300
    ports:
      - "4200:4000"
    networks:
      - shared-services

networks:
  shared-services:
    external: true
