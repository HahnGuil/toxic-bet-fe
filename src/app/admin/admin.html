<main class="admin-page" [class.page-fade-out]="isPageTransitioning()">
  <section class="admin-shell" aria-label="Área administrativa">
    <app-header (startFadeOut)="isPageTransitioning.set(true)" />

    <div class="admin-body">
      <section class="admin-content" aria-label="Conteúdo administrativo">
        <h2 class="admin-section-title">PARTIDAS EM ANDAMENTO</h2>
      </section>

      <section class="admin-match-list" aria-label="Lista de partidas em andamento">
        @for (match of inProgressMatches(); track match.matchId) {
          <app-admin-match-card
            [match]="match"
            [invalid]="isInvalid(match.matchId)"
            (stateChange)="onCardStateChange($event)"
          />
        } @empty {
          <p class="admin-match-list-empty">Nenhuma partida em andamento.</p>
        }
      </section>

      @if (submitError()) {
        <div class="admin-submit-error" role="alert">{{ submitError() }}</div>
      }

      @if (submitSuccess()) {
        <div class="admin-submit-success" role="status">Partidas encerradas com sucesso!</div>
      }
    </div>

    <div class="admin-submit-bar">
      <button
        type="button"
        class="admin-submit-btn"
        [disabled]="isSubmitting() || !hasCheckedMatches()"
        (click)="onSubmit()"
      >
        {{ isSubmitting() ? 'ENVIANDO...' : 'ENVIAR' }}
      </button>
    </div>

    <app-footer />
  </section>
</main>
