<main class="match-page" [class.page-fade-out]="isPageTransitioning()">
  <section class="match-shell" aria-label="Tela principal de partidas">
    <app-header (startFadeOut)="isPageTransitioning.set(true)" />

    <div class="match-body">
      <section class="match-content" aria-label="Conteudo principal">
        <app-dropdown
          id="championship-select"
          placeholder="Campeonato"
          [options]="championshipOptions()"
          [value]="selectedChampionshipValue()"
          (valueChange)="onChampionshipChange($event)"
        />
        <div class="match-view-switcher" aria-label="Selecionar visualizacao de partidas" role="tablist">
          <button
            type="button"
            class="match-view-option match-view-option-left"
            [class.match-view-option-active]="selectedMatchView() === 'all'"
            [attr.aria-selected]="selectedMatchView() === 'all'"
            (click)="selectMatchView('all')"
          >
            TODAS AS PARTIDAS
          </button>

          <button
            type="button"
            class="match-view-option match-view-option-right"
            [class.match-view-option-active]="selectedMatchView() === 'open'"
            [attr.aria-selected]="selectedMatchView() === 'open'"
            (click)="selectMatchView('open')"
          >
            ABERTAS PARA APOSTA
          </button>
        </div>
      </section>

      @if (selectedMatchView() === 'all') {
        <section class="match-list" aria-label="Lista de partidas">
          @for (match of matches(); track match.matchId) {
            <app-match-card [match]="match" />
          } @empty {
            <p class="match-list-empty">Nenhuma partida disponível.</p>
          }
        </section>
      }

      @if (selectedMatchView() === 'open') {
        <section class="match-list" aria-label="Partidas abertas para apostas">
          @for (match of filteredOpenMatches(); track match.matchId) {
            <app-match-card [match]="match" (betPlaced)="onBetPlaced($event)" />
          } @empty {
            <p class="match-list-empty">Nenhuma partida aberta para apostas.</p>
          }
        </section>
      }
    </div>

    <app-footer />
  </section>
</main>
