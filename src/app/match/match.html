<main class="match-page" [class.page-fade-out]="isPageTransitioning()">
  <section class="match-shell" aria-label="Tela principal de partidas">
    <header class="match-header" aria-label="Cabecalho principal">
      <div class="brand-wrap">
        <span class="brand-icon" aria-hidden="true">☢</span>
        <span class="brand-text">TOXIC BET</span>
      </div>

      <button
        type="button"
        class="logoff-link"
        aria-label="Log off"
        title="Log off"
        [disabled]="isLoggingOut()"
        (click)="logoff()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M3 3h10a2 2 0 0 1 2 2v3h-2V5H5v14h8v-3h2v3a2 2 0 0 1-2 2H3z"
          />
          <path
            fill="currentColor"
            d="M13 12.5c0-1.93 1.57-3.5 3.5-3.5A3.5 3.5 0 0 1 20 12.5v1.2h1a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-5.3a1 1 0 0 1 1-1h1zm2 1.2h3v-1.2a1.5 1.5 0 0 0-3 0z"
          />
          <path
            fill="currentColor"
            d="M8 11h7v2H8l2.2 2.2-1.4 1.4L4.2 12l4.6-4.6 1.4 1.4z"
          />
        </svg>
      </button>
    </header>

    <section class="match-content" aria-label="Conteudo principal">
      <div class="match-view-switcher" aria-label="Selecionar visualizacao de partidas" role="tablist">
        <button
          type="button"
          class="match-view-option match-view-option-left"
          [class.match-view-option-active]="selectedMatchView() === 'all'"
          [attr.aria-selected]="selectedMatchView() === 'all'"
          (click)="selectMatchView('all')"
        >
          ALL MATCHES
        </button>

        <button
          type="button"
          class="match-view-option match-view-option-right"
          [class.match-view-option-active]="selectedMatchView() === 'open'"
          [attr.aria-selected]="selectedMatchView() === 'open'"
          (click)="selectMatchView('open')"
        >
          OPEN TO BET
        </button>
      </div>
    </section>

    <footer class="match-footer" aria-label="Rodape principal"></footer>
  </section>
</main>
