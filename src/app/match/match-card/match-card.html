<article class="match-card">
  <header class="card-header">
    <span class="championship-name">{{ match().championshipName }}</span>
  </header>

  <div class="card-body">
    <div class="teams-row">
      <div class="team-box">
        <span class="team-name">{{ match().homeTeamName }}</span>
      </div>
      <span class="teams-separator" aria-hidden="true">X</span>
      <div class="team-box">
        <span class="team-name">{{ match().visitingTeamName }}</span>
      </div>
    </div>

    <div class="odds-row">
      <button type="button" class="odds-rect" [class.odds-rect--selected]="selectedOdd() === 'home'" (click)="toggleOdd('home')">
        <span class="odds-value">{{ formatOdds(match().homeTeamOdds) }}</span>
      </button>
      <button type="button" class="odds-rect" [class.odds-rect--selected]="selectedOdd() === 'draw'" (click)="toggleOdd('draw')">
        <span class="odds-value">{{ formatOdds(match().drawTeamOdds) }}</span>
      </button>
      <button type="button" class="odds-rect" [class.odds-rect--selected]="selectedOdd() === 'visiting'" (click)="toggleOdd('visiting')">
        <span class="odds-value">{{ formatOdds(match().visitingTeamOdds) }}</span>
      </button>
    </div>

    <div class="odds-labels">
      <span>HOME</span>
      <span>DRAW</span>
      <span>VISITING</span>
    </div>
  </div>

  <footer class="card-footer">
    <span class="match-time">{{ match().matchTime }}</span>
    @if (match().result === 'OPEN_FOR_BETTING') {
      <button type="button" class="place-bet-btn" [class.place-bet-btn--active]="selectedOdd() !== null" (click)="placeBet()">PLACE BET</button>
    } @else {
      <span class="match-result" [class]="resultClass(match().result)">
        {{ resultLabel(match().result) }}
      </span>
    }
  </footer>
</article>

@if (showBetError()) {
  <div class="bet-error-banner" role="alert" (click)="dismissError()">
    You need to select a odd to place a bet
  </div>
}
