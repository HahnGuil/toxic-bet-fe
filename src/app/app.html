<main class="app-shell">
  <section class="hero-card" aria-labelledby="pwa-title">
    <p class="eyebrow">Toxic Bet</p>
    <h1 id="pwa-title">PWA pronta para celular</h1>
    <p class="description">
      Testando testando testando
    </p>

    <div class="actions">
      @if (installAvailable()) {
        <button type="button" class="btn btn-primary" (click)="installApp()">Instalar app</button>
      }

      <button type="button" class="btn btn-secondary" (click)="checkBackends()">
        Validar conexao com back-ends
      </button>
    </div>

    <div class="status-grid" role="status" aria-live="polite">
      <article class="status-card">
        <h2>Conectividade do dispositivo</h2>
        <p [class.state-online]="isOnline()" [class.state-offline]="!isOnline()">
          {{ isOnline() ? 'Online' : 'Offline' }}
        </p>
      </article>

      <article class="status-card">
        <h2>API toxic-bet</h2>
        <p [class.state-online]="apiConnection() === 'online'" [class.state-offline]="apiConnection() === 'offline'">
          {{ apiConnection() }}
        </p>
      </article>

      <article class="status-card">
        <h2>Auth server</h2>
        <p [class.state-online]="authConnection() === 'online'" [class.state-offline]="authConnection() === 'offline'">
          {{ authConnection() }}
        </p>
      </article>
    </div>
  </section>
</main>
