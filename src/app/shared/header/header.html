<header class="app-header" aria-label="Cabecalho principal">
  <div class="brand-wrap">
    <svg class="brand-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="white">
      <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8"/>
      <path d="M9.653 5.496A3 3 0 0 0 8 5c-.61 0-1.179.183-1.653.496L4.694 2.992A5.97 5.97 0 0 1 8 2c1.222 0 2.358.365 3.306.992zm1.342 2.324a3 3 0 0 1-.884 2.312 3 3 0 0 1-.769.552l1.342 2.683c.57-.286 1.09-.66 1.538-1.103a6 6 0 0 0 1.767-4.624zm-5.679 5.548 1.342-2.684A3 3 0 0 1 5.005 7.82l-2.994-.18a6 6 0 0 0 3.306 5.728ZM10 8a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/>
    </svg>
    <span class="brand-text">TOXIC BET</span>
  </div>

  <div class="header-actions">
    @if (pushNotifications.isSupported()) {
      <button
        type="button"
        class="header-action"
        [class.header-action-active]="pushNotifications.isSubscribed()"
        [attr.aria-label]="pushNotifications.isSubscribed() ? 'Desativar notificações' : 'Ativar notificações'"
        [attr.title]="pushNotifications.isSubscribed() ? 'Desativar notificações' : 'Ativar notificações'"
        [disabled]="pushNotifications.isBusy()"
        (click)="toggleNotifications()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 22a2.6 2.6 0 0 0 2.45-1.75h-4.9A2.6 2.6 0 0 0 12 22" />
          <path fill="currentColor" d="M19 17h-1V10a6 6 0 0 0-4.5-5.8V3a1.5 1.5 0 0 0-3 0v1.2A6 6 0 0 0 6 10v7H5a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2M8 17v-7a4 4 0 0 1 8 0v7z" />
        </svg>
      </button>
    }

    <button
      type="button"
      class="header-action"
      aria-label="Sair"
      title="Sair"
      [disabled]="isLoggingOut()"
      (click)="logoff()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M3 3h10a2 2 0 0 1 2 2v3h-2V5H5v14h8v-3h2v3a2 2 0 0 1-2 2H3z"
        />
        <path
          fill="currentColor"
          d="M13 12.5c0-1.93 1.57-3.5 3.5-3.5A3.5 3.5 0 0 1 20 12.5v1.2h1a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-5.3a1 1 0 0 1 1-1h1zm2 1.2h3v-1.2a1.5 1.5 0 0 0-3 0z"
        />
        <path
          fill="currentColor"
          d="M8 11h7v2H8l2.2 2.2-1.4 1.4L4.2 12l4.6-4.6 1.4 1.4z"
        />
      </svg>
    </button>
  </div>
</header>
