<article class="bet-card">
  <div class="card-body">
    <div class="teams-row">
      <div class="team-box">
        <span class="team-name">{{ bet().homeTeamName }}</span>
        <span class="team-score">{{ bet().homeTeamScore }}</span>
      </div>
      <span class="teams-separator" aria-hidden="true">X</span>
      <div class="team-box">
        <span class="team-name">{{ bet().visitingTeamName }}</span>
        <span class="team-score">{{ bet().visitingTeamScore }}</span>
      </div>
    </div>

    <div class="bet-metrics-row">
      <div class="bet-metric">
        <span class="bet-metric-label">ODD DA APOSTA</span>
        <span class="bet-metric-value">{{ bet().betOdds }}</span>
      </div>
      <div class="bet-metric">
        <span class="bet-metric-label">PONTOS</span>
        <span class="bet-metric-value">{{ bet().betPoints }}</span>
      </div>
    </div>

    <div
      class="result-row"
      [class.result-row--winner]="isWinner()"
      [class.result-row--loser]="!isWinner()"
      aria-label="Resultado da partida versus resultado apostado"
    >
      <div class="result-item">
        <span class="result-label">PARTIDA</span>
        <span class="result-value">{{ resultLabel(bet().matchResult) }}</span>
      </div>
      <span class="result-separator" aria-hidden="true">X</span>
      <div class="result-item">
        <span class="result-label">APOSTA</span>
        <span class="result-value">{{ resultLabel(bet().betResult) }}</span>
      </div>
    </div>
  </div>
</article>
